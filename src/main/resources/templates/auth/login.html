<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
</head>

<style>
    body {
        /* border: 1px solid; */
        margin: 10px auto;
        width: 960px;
        height: auto;
    }

    #header {
        border: 1px solid;
        border-color: royalblue;
        margin: 20px auto;
        width: 960px;
        display: flex;
    }

    #logo {
        /* border: 1px solid; */
        width: 200px;
        height: 100px;
        background-color: #868FEE;
        /* background-color: #7480FF; */

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #menu {
        /* border: 1px solid; */
        height: 100px;
        width: 760px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu ul {
        /* border: 1px solid; */
        padding-left: 0;
        /*기본 들여쓰기 제거*/
    }

    #menu a {
        position: relative;
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    #menu a::after {
        content: "⭐";
        position: absolute;
        top: -19px;
        /*글자 바로 위 배치*/
        left: 50%;
        /*중앙 배치*/
        transform: translateX(-50%);
        /*정확히 중앙에 맞추기*/
        opacity: 0;
        transition: 0.2s ease;
        font-size: 14px;
    }

    #menu a:hover {
        /* color: #5C63FF; */
        color: mediumspringgreen;
    }

    #menu a:hover::after {
        opacity: 1;
    }

    #menu1 {
        /* border: 1px solid; */
        height: 100px;
        width: 570px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu1 li {
        list-style: none;
        /*리스트 불릿 제거*/
        /* border: 1px solid; */
        height: 90px;

        margin: 0 30px;
        width: 190px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 {
        /* border: 1px solid; */
        height: 100px;
        width: 190px;
        background-color: #fffedc;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 li {
        list-style: none;
        /*리스트 불릿 제거*/
        /* border: 1px solid; */
        height: 90px;

        margin: 0 30px;
        width: 210px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #footer {
        /* border: 1px solid; */
        border-top: 1px solid;
        border-color: royalblue;

        margin-top: 20px;
        height: 150px;
        width: 960px;
        display: block;
        background-color: white;
    }

    #footUp {
        /* border: 1px solid; */
        height: 50px;
        width: 960px;
        margin: 10px auto;
        text-align: center;
        gap: 40px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    #footUp a {
        color: black;
        text-decoration: none;
    }

    #footUp a:hover {
        /* color: rebeccapurple; */
        color: mediumspringgreen;
    }

    #footdown {
        /* border: 1px solid; */
        height: 50px;
        width: 960px;
        margin: 20px auto;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    #body {
        /* border: 1px solid; */
        height: 700px;
        width: 960px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #loginBox {
        border: 1px solid;
        border-color: royalblue;
        border-radius: 10px;

        height: 380px;
        width: 480px;
        background-color: white;
    }

    #loginBox h2 {
        /* border: 1px solid; */
        height: 60px;
        margin: 15px;
        color: royalblue;
        background-color: #dce7ff;
        border-radius: 10px;

        /* 가운데 정렬 */

        justify-content: center;
        align-items: center;
    }

    #boxIN2 {
        /* border: 1px solid; */
        height: auto;
        padding-top: 18px;
        margin: 15px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;

        gap: 40px;
    }

    #boxIN2 span {
        /* border: 1px solid; */
        font-size: 18px;
        font-weight: bold;
        color: royalblue;

        display: inline-block;
        width: 215px;
        text-align: left;

        margin-bottom: 5px;
    }

    #boxIN2 input {
        display: block;
        height: 20px;
        margin-bottom: 20px;
        padding: 8px;
        width: 200px;
    }

    #boxIN2 button {
        border-radius: 10px;

        display: flexbox;
        height: 125px;
        width: 80px;

        font-size: 15px;
        font-weight: bold;
    }

    #boxIN2 button:hover {
        font-weight: bold;
        color: white;

        border-color: royalblue;
        background-color: rgb(202, 213, 245)
    }

    #boxIN3 {
        /* border: 1px solid; */
        border-top: royalblue 1px solid;
        padding: 15px;
        margin: 15px;
    }

    #boxIN3 a {
        /* border: 1px solid; */
        display: inline;
        width: 400px;
        font-size: 17px;

        color: black;
        text-decoration: none;
    }

    #boxIN3 a:hover {
        color: mediumvioletred;
        /* font-weight: bold; */
    }
</style>

<body>
    <div id="header">
        <div id="logo">
            <img src="./img/headerLogo.PNG" alt="헤더로고(세로 79px*가로140px)">
        </div>

        <div id="menu">
            <ul id="menu1">
                <li id="home"><a href="">홈</a></li>
                <li id="tourList"><a href="">여행지</a></li>
                <li id="freeBoard"><a href="">자유게시판</a></li>
            </ul>
            <ul id="menu2">
                <li id="member">
                    <a id="goLogin" href="./member-login.html">로그인/회원가입</a>
                    <a id="myPage" href="./member-mypage.html" style="display: none;">마이페이지</a>
                </li>
            </ul>
        </div>
    </div>



    <div id="body">
        <div id="loginBox">
            <div>
                <h2>◈ 로그인 ◈</h2>
            </div>
            <div id="boxIN2">
                <div>
                    <span>아이디</span>
                    <input type="text" id="userId" placeholder="이메일 형식 아이디 입력">
                    <span>비밀번호</span>
                    <input type="password" id="userPass" placeholder="비밀번호 입력">
                </div>
                <div>
                    <button onclick="login()">로그인</button>
                </div>
            </div>
            <div id="boxIN3">
                <span>계정이 없으신가요?</span>
                <a href="./member-join.html">'회원가입' ▶</a>
            </div>
        </div>
    </div>




    <div id="footer">
        <div id="footUp">
            <a href="">1:1문의</a>
            <a href="">공지사항</a>
            <a href="">Q&A</a>
            <a href="">사이트 소개</a>
        </div>
        <div id="footdown">
            <img src="./img/footerLogo.PNG" alt="작은로고">
        </div>
    </div>


    <script src="menu.js"></script>
    <script>
        function login() {
            const userId = document.getElementById("userId").value;
            const userPass = document.getElementById("userPass").value;

            if (!userId || !userPass) {
                alert("아이디와 비밀번호를 제대로 입력하세요.");
                return;
            }

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, password: userPass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("로그인 성공!");
                    user.isLogin = true;
                    
                    user.id = data.login_id;
                    user.name = data.name;
                    user.nickName = data.nickname;

                    updateMenu();
                    window.location.href = "./member-mypage.html";
                } else {
                    alert("로그인 실패");
                }
            })
            .catch(err => console.error(err));
        }
    </script>

</body>
</html>
