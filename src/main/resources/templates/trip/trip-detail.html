<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행지 상세조회</title>
</head>

<style>
    body {
        /* border: 1px solid; */
        margin: 10px auto;
        width: 960px;
        height: auto;
    }

    #header {
        border: 1px solid;
        border-color: royalblue;
        margin: 20px auto;
        width: 960px;
        display: flex;
    }

    #logo {
        /* border: 1px solid; */
        width: 200px;
        height: 100px;
        background-color: #868FEE;
        /* background-color: #7480FF; */

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #menu {
        /* border: 1px solid; */
        height: 100px;
        width: 760px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu ul {
        /* border: 1px solid; */
        padding-left: 0;
        /*기본 들여쓰기 제거*/
    }

    #menu a {
        position: relative;
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    #menu a::after {
        content: "⭐";
        position: absolute;
        top: -19px;
        /*글자 바로 위 배치*/
        left: 50%;
        /*중앙 배치*/
        transform: translateX(-50%);
        /*정확히 중앙에 맞추기*/
        opacity: 0;
        transition: 0.2s ease;
        font-size: 14px;
    }

    #menu a:hover {
        /* color: #5C63FF; */
        color: mediumspringgreen;
    }

    #menu a:hover::after {
        opacity: 1;
    }

    #menu1 {
        /* border: 1px solid; */
        height: 100px;
        width: 570px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu1 li {
        list-style: none;
        /*리스트 불릿 제거*/
        /* border: 1px solid; */
        height: 90px;

        margin: 0 30px;
        width: 190px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 {
        /* border: 1px solid; */
        height: 100px;
        width: 190px;
        background-color: #fffedc;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 li {
        list-style: none;
        /*리스트 불릿 제거*/
        /* border: 1px solid; */
        height: 90px;

        margin: 0 30px;
        width: 210px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .detail body {
        margin: 0;
        padding: 0;
        background: #f5f7fa;
        font-family: "Noto Sans KR", sans-serif;
        color: #333;
    }

    .detail-container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    /* 대표 이미지 */
    .detail-image img {
        width: 100%;
        height: 350px;
        object-fit: cover;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* 제목 */
    .detail-header {
        margin-top: 25px;
    }

    .detail-header h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        font-size: 18px;
        color: #666;
    }

    /* 정보 카드들 */
    .info-cards {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .info-card {
        display: flex;
        gap: 12px;
        background: white;
        padding: 15px;
        border-radius: 14px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        align-items: center;
    }

    .info-card .icon {
        width: 30px;
        height: 30px;
        object-fit: contain;
    }

    /* 상세 설명 */
    .detail-content {
        margin-top: 40px;
        background: white;
        padding: 20px 25px;
        border-radius: 18px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .detail-content h2 {
        margin-bottom: 15px;
    }

    /* 목록 버튼 */
    .back-btn-wrap {
        margin-top: 35px;
        text-align: center;
    }

    .back-btn {
        display: inline-block;
        padding: 12px 22px;
        background: #1e90ff;
        color: white;
        font-size: 16px;
        border-radius: 12px;
        text-decoration: none;
    }

    .back-btn:hover {
        background: #006edc;
    }

    #footer {
        /* border: 1px solid; */
        border-top: 1px solid;
        border-color: royalblue;

        margin-top: 20px;
        height: 150px;
        width: 960px;
        display: block;
        background-color: white;
    }

    #footUp {
        /* border: 1px solid; */
        height: 50px;
        width: 960px;
        margin: 10px auto;
        text-align: center;
        gap: 40px;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    #footUp a {
        color: black;
        text-decoration: none;
    }

    #footUp a:hover {
        /* color: rebeccapurple; */
        color: mediumspringgreen;
    }

    #footdown {
        /* border: 1px solid; */
        height: 50px;
        width: 960px;
        margin: 20px auto;

        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<body>
    <div id="header">
        <div id="logo">
            <img src="./img/headerLogo.PNG" alt="헤더로고(세로 79px*가로140px)">
        </div>

        <div id="menu">
            <ul id="menu1">
                <li id="home"><a href="">홈</a></li>
                <li id="tourList"><a href="">여행지</a></li>
                <li id="freeBoard"><a href="">자유게시판</a></li>
            </ul>
            <ul id="menu2">
                <li id="member">
                    <a id="goLogin" href="">로그인/회원가입</a>
                    <a id="myPage" href="" style="display: none;">마이페이지</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="detail-container">

        <!-- 대표 이미지 -->
        <div class="detail-image">
            <img src="img/sample1.jpg" alt="경복궁">
        </div>

        <!-- 제목 & 설명 -->
        <section class="detail-header">
            <h1>경복궁</h1>
            <p class="subtitle">아름다운 전통 궁궐</p>
        </section>

        <!-- 정보 카드 -->
        <section class="info-cards">
            <div class="info-card address-card">
                <img src="img/icon/location.png" class="icon">
                <div>
                    <h4>주소</h4>
                    <p class="value">서울 종로구 사직로 161</p>
                </div>
            </div>

            <div class="info-card time-card">
                <img src="img/icon/time.png" class="icon">
                <div>
                    <h4>운영 시간</h4>
                    <p class="value">09:00 ~ 18:00</p>
                </div>
            </div>

            <div class="info-card phone-card">
                <img src="img/icon/phone.png" class="icon">
                <div>
                    <h4>문의</h4>
                    <p class="value">02-3700-3900</p>
                </div>
            </div>
        </section>

        <!-- 상세 설명 -->
        <section class="detail-content">
            <h2>상세 소개</h2>
            <p class="desc">
                경복궁은 조선 시대의 정궁으로, 역사와 문화를 느낄 수 있는
                대표적인 명소입니다. 고궁과 정원의 아름다움, 근정전과 경회루까지
                감상할 수 있어 국내외 많은 관광객들이 찾는 장소입니다.
            </p>
        </section>

        <!-- 목록으로 돌아가기 -->
        <div class="back-btn-wrap">
            <a href="trip.html" class="back-btn">목록으로 돌아가기</a>
        </div>

    </main>

    <div id="footer">
        <div id="footUp">
            <a href="">1:1문의</a>
            <a href="">공지사항</a>
            <a href="">Q&A</a>
            <a href="">사이트 소개</a>
        </div>
        <div id="footdown">
            <img src="./img/footerLogo.PNG" alt="작은로고">
        </div>
    </div>

    <script>

        // URL에서 id 꺼내기
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        // 샘플 데이터 (디자인 확인용)
        const sampleData = {
            image: "img/sample1.jpg",
            title: "경복궁",
            shortDesc: "아름다운 전통 궁궐",
            address: "서울 종로구 사직로 161",
            operatingTime: "09:00 ~ 18:00",
            phone: "02-3700-3900",
            description: "경복궁은 조선 시대의 정궁으로, 역사와 문화를 느낄 수 있는 대표적인 명소입니다."
        };

        // 화면 렌더링 함수
        function renderDetail(data) {
            document.querySelector(".detail-image img").src = data.image;
            document.querySelector(".detail-image img").alt = data.title;

            document.querySelector(".detail-header h1").innerText = data.title;
            document.querySelector(".subtitle").innerText = data.shortDesc;

            document.querySelector(".address-card .value").innerText = data.address;
            document.querySelector(".time-card .value").innerText = data.operatingTime;
            document.querySelector(".phone-card .value").innerText = data.phone;

            document.querySelector(".detail-content .desc").innerText = data.description;
        }

        // API 연동 함수
        async function loadDetail() {
            // id가 없으면: 디자인 확인 모드 (샘플 데이터로 렌더링)
            if (!id) {
                console.warn("id 없음 → 디자인 미리보기 모드 작동");
                renderDetail(sampleData);
                return;
            }

            // id가 있으면: 실제 API 호출
            try {
                const res = await fetch(`https://api.server.com/trips/${id}`);

                if (!res.ok) {
                    throw new Error("API 오류: " + res.status);
                }

                const data = await res.json();
                renderDetail(data);

            } catch (err) {
                console.error("상세정보 에러:", err);
                alert("상세 정보를 불러올 수 없습니다. (샘플 데이터로 표시됩니다.)");

                // API 오류 시에도 샘플 데이터 표시
                renderDetail(sampleData);
            }
        }

        loadDetail();
    </script>

</body>

</html>
