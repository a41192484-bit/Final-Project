    #menu1 {

    #footdown {

    #catego a {

    #catego a::after {

<body>
    <div id="header">

            <ul id="menu1">
                <li id="home"><a href="">홈</a></li>

    <div id="body">

            <div id="catego">

                        <a href="./member-myaccount.html">정보 관리</a>

        <div id="footUp">
            <a href="">1:1문의</a>

    <script src="menu.js"></script>
    <script>

        //로그아웃
        const logoutBtn = document.querySelector("#logout a");

        logoutBtn.addEventListener("click", (event) => {
            //preventDefault()브라우저의 기본 동작을 막는 메서드.
            //페이지 이동하지 말고 내가 작성한 코드를 실행해라.
            event.preventDefault();

            //로그인상태 초기화
            user.isLogin = false;

            //메뉴 업데이트
            updateMenu();
            alert("로그아웃 되었습니다!");
        });


        //회원탈퇴
        const memberOutBtn = document.querySelector("#memberOut a");

        memberOutBtn.addEventListener("click",(event) => {
            //페이지 이동 ㄴㄴ, 내가 작성한 코드 실행ㄱㄱ
            event.preventDefault();

            //해당 계정의 데이터베이스를 비활성화 하기
            //지금 로그인한 아이디와 데이터베이스 비교 -> 동일하면 진행
            if(user.isLogin == true || user.id == data.login_id){
                if(confirm("정말 회원탈퇴 하시겠습니까?")){
                    
                    alert("회원탈퇴 완료. 메인화면으로 돌아갑니다.");
                }else{
                    alert("마이페이지로 돌아갑니다.");
                }
            }
        })
    </script>
