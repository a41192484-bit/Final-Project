<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>

    <style>
        body {
            margin: 10px auto;
            width: 960px;
        }

        #header {
            border: 1px solid royalblue;
            margin: 20px auto;
            width: 960px;
            display: flex;
        }

        #logo {
            width: 200px;
            height: 100px;
            background-color: #868FEE;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu {
            height: 100px;
            width: 760px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu ul {
            padding-left: 0;
        }

        #menu a {
            position: relative;
            color: black;
            text-decoration: none;
        }

        #menu a::after {
            content: "⭐";
            position: absolute;
            top: -19px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: 0.2s ease;
            font-size: 14px;
        }

        #menu a:hover {
            color: mediumspringgreen;
        }

        #menu a:hover::after {
            opacity: 1;
        }

        #menu1 {
        height: 100px;
        width: 570px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu1 li {
        list-style: none;
        height: 90px;
        margin: 0 30px;
        width: 190px;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

        #menu2 {
            height: 100px;
            width: 190px;
            background-color: #fffedc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu2 li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
        }

        #footer {
            border-top: 1px solid royalblue;
            margin-top: 20px;
            height: 150px;
            width: 960px;
        }

        #footUp {
            height: 50px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        #footUp a {
            text-decoration: none;
            color: black;
        }

        #footUp a:hover {
            color: mediumspringgreen;
        }

        #footdown {
            height: 50px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #select {
            width: 100px;
            height: 40px;
        }

        #textc {
            width: 960px;
            height: 200px;
        }

        #textt {
            width: 100%;
            height: 40px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .input-row div {
            display: flex;
            flex-direction: column;
        }

        .input-row input {
            width: 200px;
            height: 40px;
            padding-left: 10px;
        }

        .file-box {
            margin-top: 25px;
            padding: 20px;
            width: 520px;
            background-color: #fdfdff;
            border-radius: 12px;
            border: 1px solid #e1e1f9;
            box-shadow: 0px 2px 6px rgba(180, 180, 255, 0.25);
        }

        .file-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #4a4a9f;
        }

        .file-box input {
            display: block;
            margin: 10px 0;
        }

        .action-btn {
            padding: 10px 20px;
            background-color: rgb(148, 157, 255);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div id="header">
        <div id="logo">
            <img src="./img/headerLogo.PNG" alt="">
        </div>

        <div id="menu">
            <ul id="menu1">
                <li><a href="">홈</a></li>
                <li><a href="">여행지</a></li>
                <li><a href="">자유게시판</a></li>
            </ul>
            <ul id="menu2">
                <li>
                    <a href="">로그인/회원가입</a>
                    <a href="" style="display: none;">마이페이지</a>
                </li>
            </ul>
        </div>
    </div>

    <h1>글 등록</h1>
    <hr>

    <form>
        <div class="input-row">
            <div>
                <label>작성자</label>
                <input type="text" id="writer">
            </div>

            <div>
                <label>여행지ID</label>
                <input type="text" id="locationId">
            </div>
        </div>

        <div class="input-row" style="margin-top: 30px;">
            <div>
                <label>카테고리</label>
                <select id="select">
                    <option>정보</option>
                    <option>후기</option>
                    <option>자유</option>
                    <option>기타</option>
                </select>
            </div>

            <div style="flex: 1;">
                <label>제목</label>
                <input type="text" id="textt" placeholder="제목 입력">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <textarea id="textc" placeholder="내용을 남겨주세요"></textarea>
        </div>

        <div class="file-box">
            <div class="file-title">첨부 파일</div>
            <input type="file" accept=".hwp, .hwpx, application/msword">
            <input type="file" accept=".hwp, .hwpx, application/msword">
        </div>

        <div style="margin-top: 20px;">
            <input type="checkbox"> 회원만 보기
        </div>

        <div style="margin-top: 25px;">
            <button class="action-btn">저장하기</button>
        </div>
    </form>

    <div id="footer">
        <div id="footUp">
            <a href="">1:1문의</a>
            <a href="">공지사항</a>
            <a href="">Q&A</a>
            <a href="">사이트 소개</a>
        </div>

        <div id="footdown">
            <img src="./img/footerLogo.PNG" alt="">
        </div>
    </div>

</body>
</html>
