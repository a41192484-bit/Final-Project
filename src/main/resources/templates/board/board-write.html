<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>

    <style>
        #select {
            width: 100px;
            height: 40px;
        }

        #textc {
            width: 960px;
            height: 200px;
        }

        #textt {
            width: 100%;
            height: 40px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .input-row div {
            display: flex;
            flex-direction: column;
        }

        .input-row input {
            width: 200px;
            height: 40px;
            padding-left: 10px;
        }

        .file-box {
            margin-top: 25px;
            padding: 20px;
            width: 520px;
            background-color: #fdfdff;
            border-radius: 12px;
            border: 1px solid #e1e1f9;
            box-shadow: 0px 2px 6px rgba(180, 180, 255, 0.25);
        }

        .file-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #4a4a9f;
        }

        .file-box input {
            display: block;
            margin: 10px 0;
        }

        .action-btn {
            padding: 10px 20px;
            background-color: rgb(148, 157, 255);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <h1>글 등록</h1>
        <hr>
        <form>
            <div class="input-row">
                <div>
                    <label>작성자</label>
                    <input type="text" id="writer">
                </div>

                <div>
                    <label>여행지ID</label>
                    <input type="text" id="locationId">
                </div>
            </div>

            <div class="input-row" style="margin-top: 30px;">
                <div>
                    <label>카테고리</label>
                    <select id="select">
                        <option>정보</option>
                        <option>후기</option>
                        <option>자유</option>
                        <option>기타</option>
                    </select>
                </div>

                <div style="flex: 1;">
                    <label>제목</label>
                    <input type="text" id="textt" placeholder="제목 입력">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <textarea id="textc" placeholder="내용을 남겨주세요"></textarea>
            </div>

            <div class="file-box">
                <div class="file-title">첨부 파일</div>
                <input type="file" accept=".hwp, .hwpx, application/msword">
                <input type="file" accept=".hwp, .hwpx, application/msword">
            </div>

            <div style="margin-top: 20px;">
                <input type="checkbox"> 회원만 보기
            </div>

            <div style="margin-top: 25px;">
                <button class="action-btn">저장하기</button>
            </div>
        </form>
    </div>
</body>

</html>
