<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

<style>
    body {
        /* border: 1px solid; */
        margin: 10px auto;
        width: 960px;
        height: auto;
    }

    #header {
        border: 1px solid;
        border-color: royalblue;
        margin: 20px auto;
        width: 960px;
        display: flex;
    }

    #logo {
        /* border: 1px solid; */
        width: 200px;
        height: 100px;
        background-color: #868FEE;
        /* background-color: #7480FF; */

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #menu {
        /* border: 1px solid; */
        height: 100px;
        width: 760px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu ul {
        /* border: 1px solid; */
        /*기본 들여쓰기 제거*/
        padding-left: 0;
    }

    #menu a {
        position: relative;
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    #menu a::after {
        content: "⭐";
        position: absolute;
        top: -19px;
        /*글자 바로 위 배치*/
        left: 50%;
        /*중앙 배치*/
        transform: translateX(-50%);
        /*정확히 중앙에 맞추기*/
        opacity: 0;
        transition: 0.2s ease;
        font-size: 14px;
    }

    #menu a:hover {
        /* color: #5C63FF; */
        color: mediumspringgreen;
    }

    #menu a:hover::after {
        opacity: 1;
    }

    #menu1 {
        /* border: 1px solid; */
        height: 100px;
        width: 570px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu1 li {
        list-style: none;
        /*리스트 불릿 제거*/

        width: 190px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */

        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 {
        /* border: 1px solid; */

        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #menu2 li {
        list-style: none;
        /*리스트 불릿 제거*/
        /* border: 1px solid; */
        height: 90px;

        margin: 0 30px;
        width: 210px;
        font-size: 18px;
        font-weight: bold;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #footer {
        /* border: 1px solid; */

        margin-top: 20px;

    #footUp {

    #footUp a {

    }

    #footUp a:hover {

    }

    #footdown {
        /* border: 1px solid; */
        height: 50px;
        width: 960px;

        display: flex;

    #body {

        width: 960px;

        /* 가로 가운데 정렬 */

    #back {

    #joinInfo {

    #title {

    #infoList {
        /* border: 1px solid; */
        height: 490px;
        margin: 15px;

        /* 가운데 정렬 */
        display: flex;
        justify-content: center;

    }

    #infoList ul {
        /*기본 들여쓰기 제거*/

    #infoList .label {

<body>

    <div id="body">

                <span>◈ 정보 조회 ◈</span>

                <ul>
                    <li>

    <script src="menu.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            //html에서 찾아서 js 변수에 가져온다
            const displayId = document.getElementById("displayId");
            const displayPW = document.getElementById("displayPW");
            const displayUsername = document.getElementById("displayUsername");
            const displayNickname = document.getElementById("displayNickname");

            //각각의 textContent에 데이터를 넣어서 초기화면 셋팅
            displayId.textContent = user.id;
            displayPW.textContent = "*".repeat(user.password.length);
            displayUsername.textContent = user.name;
            displayNickname.textContent = user.nickName;

            //수정버튼 누를 때
            document.querySelectorAll(".editBtn").forEach(btn => {
                btn.addEventListener("click", function () {
                    //수정버튼이 있는 것: PW, Username, Nickname
                    const modTarget = btn.dataset.target;

                    let spanId; //span 변수
                    let original;  //원래 화면에 있던 텍스트 변수

                    //조건: 버튼명이 수정 이라면?
                    if (btn.textContent === "수정") {
                        //span 아이디명 찾기
                        spanId = document.getElementById('display${modTarget}');
                        //초기값
                        if (modTarget === "PW") {
                            original = userData.password
                        } else {
                            original = spanId.textContent
                        };

                        //input 생성
                        const input = document.createElement("input");
                        //조건 ? "참":"거짓"
                        input.type = modTarget === "PW" ? "password" : "text";
                        //유저가 수정할 값
                        input.value = original;

                        //span->input으로 교체
                        spanElement.replaceWith(input);

                        //버튼 텍스트를 '확인'으로 변경
                        btn.textContent = "저장";
                    } else if (btn.textContent === "저장") {
                        //버튼의 부모속성에서 input요소 첫번째 한 개를 찾기
                        const input = btn.parentElement.querySelector("input");
                        const newValue = input.value;

                        //userData에 저장
                        if (modTarget === "PW") {
                            userData.password = newValue;
                        } else if (modTarget === "USername") {
                            userData.name = newValue;
                        } else if (modTarget === "Nickname") {
                            userData.nickname = newValue;
                        }

                        //span 복원
                        const newSpan = document.createElement("span");
                        newSpan.id = 'display${modTarget}'

                        if (modTarget === "PW") {
                            newSpan.textContent = "*".replace(newValue.length);
                        } else {
                            newSpan.textContent = newValue;
                        }

                        input.replaceWith(newSpan);

                        //버튼 원래대로
                        btn.textContent = "수정";
                    }
                });
            });
        });
    </script>

</body>
